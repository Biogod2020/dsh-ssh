name: Verify and publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Verification scope for development (tags always run all gates)
        type: choice
        default: all
        options: [all, kernel-only]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}-${{ inputs.verification_scope || 'all' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_type == 'tag' || inputs.verification_scope != 'kernel-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Check package identity and release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(pkg.name, '@biogod/dsh-ssh')
          assert.equal(process.env.GITHUB_REPOSITORY, 'Biogod2020/dsh-ssh')
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`)
          NODE
      - name: Install pinned build tools and isolated SSH test support
        run: |
          npm install --global npm@11.15.0 pnpm@11.20.0 --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - name: Install locked dependencies and supported DSH runtimes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/dsh-alpha" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-alpha.4
          npm install --prefix "$RUNNER_TEMP/dsh-rc" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          npm install --prefix "$RUNNER_TEMP/dsh-rc21" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Test, typecheck, build and pack the verified archive
        env:
          DSH_REMOTE_TEST_DSH: ${{ runner.temp }}/dsh-rc21/node_modules/.bin/dsh
        run: pnpm release:local "$RUNNER_TEMP/release"
      - name: Accept the exact archive in all three reviewed DSH runtimes
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release/"*.tgz)
          test "${#archives[@]}" -eq 1
          node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-alpha/node_modules/.bin/dsh" "${archives[0]}"
          node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-rc/node_modules/.bin/dsh" "${archives[0]}"
          node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-rc21/node_modules/.bin/dsh" "${archives[0]}"
      - name: Verify the retained alpha.4 remote runtime
        env:
          DSH_REMOTE_TEST_DSH: ${{ runner.temp }}/dsh-alpha/node_modules/.bin/dsh
        run: pnpm exec vitest run tests/remote-runtime.test.ts
      - name: Verify the actual rc.2 SDK unary acknowledgement contract with mock Context and transport
        run: node --experimental-transform-types scripts/operation-rpc-contract.mjs "$RUNNER_TEMP/dsh-rc21/node_modules/@deepseek-ai/dsh-client-connection/lib/client.browser.js" "$RUNNER_TEMP/release/operation-rpc-contract.json"
      - name: Verify the packaged offline downgrade exporter without reviving cleared history
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release/"*.tgz)
          test "${#archives[@]}" -eq 1
          node scripts/fetch-legacy-history-archive.mjs "$RUNNER_TEMP/frozen-jay39.tgz"
          node --experimental-transform-types scripts/history-downgrade-smoke.mjs "${archives[0]}" "$RUNNER_TEMP/release/downgrade-verification.json" "$RUNNER_TEMP/dsh-rc21/node_modules/.bin/dsh" "$RUNNER_TEMP/frozen-jay39.tgz"
      - name: Read a large catalog and accept the live directory feed in three installed runtimes
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release/"*.tgz)
          test "${#archives[@]}" -eq 1
          for runtime in alpha rc rc21; do
            node --experimental-transform-types scripts/catalog-runtime-smoke.mjs "$RUNNER_TEMP/dsh-$runtime/node_modules/.bin/dsh" "${archives[0]}" "$RUNNER_TEMP/release/catalog-verification-$runtime.json"
          done
      - name: Accept incremental disk history and calibrate the long-run observer for 30 seconds
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release/"*.tgz)
          test "${#archives[@]}" -eq 1
          DSH_HISTORY_ARCHIVE_REPORT="$RUNNER_TEMP/release/history-acceptance.json" DSH_HISTORY_SOAK_REPORT="$RUNNER_TEMP/release/soak-calibration.json" node --experimental-transform-types scripts/history-delta-smoke.mjs "$RUNNER_TEMP/dsh-rc21/node_modules/.bin/dsh" "${archives[0]}" --outages --soak-seconds=30
      - name: Survive SSH disconnect in the installed archive
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/release/"*.tgz)
          test "${#archives[@]}" -eq 1
          node --experimental-transform-types scripts/tunnel-disconnect-smoke.mjs "$RUNNER_TEMP/dsh-rc21/node_modules/.bin/dsh" "${archives[0]}"
      - name: Measure immutable history storage against the frozen jay.39 baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/history-benchmarks"
          node scripts/fetch-history-baseline.mjs "$RUNNER_TEMP/history-benchmarks/baseline.ts"
          for events in 10000 100000; do
            node --expose-gc --experimental-transform-types scripts/history-store-benchmark.mjs "$RUNNER_TEMP/history-benchmarks/baseline.ts" "$events" 100 > "$RUNNER_TEMP/history-benchmarks/baseline-$events.json"
            node --expose-gc --experimental-transform-types scripts/history-store-benchmark.mjs "$PWD/src/remote/history-store.ts" "$events" 100 > "$RUNNER_TEMP/history-benchmarks/candidate-$events.json"
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { join } from 'node:path'
          let harness
          const implementations=new Map()
          for(const events of [10000,100000])for(const store of ['baseline','candidate']){
            const report=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'history-benchmarks',`${store}-${events}.json`),'utf8'))
            assert.equal(report.failures,0)
            assert.equal(report.events,events)
            assert.match(report.moduleSha256,/^[a-f0-9]{64}$/)
            if(implementations.has(store))assert.equal(report.moduleSha256,implementations.get(store))
            else implementations.set(store,report.moduleSha256)
            harness ??= report.harnessSha256
            assert.match(harness,/^[a-f0-9]{64}$/)
            assert.equal(report.harnessSha256,harness)
            for(const phase of ['warm','append','unchanged','restart']){
              assert.equal(report[phase].milliseconds.samples,['append','restart'].includes(phase)?30:100)
              for(const value of Object.values(report[phase]))assert(Number.isFinite(value.total)&&value.total>=0)
            }
            assert.equal(report.unchanged.applicationBytesWritten.total,0)
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: history-storage-measurements
          path: ${{ runner.temp }}/history-benchmarks/*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: operation-rpc-contract
          path: ${{ runner.temp }}/release/operation-rpc-contract.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: offline-downgrade-verification
          path: ${{ runner.temp }}/release/downgrade-verification.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: soak-observer-calibration
          path: |
            ${{ runner.temp }}/release/soak-calibration.json
            ${{ runner.temp }}/release/history-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: compiled-catalog-verification
          path: ${{ runner.temp }}/release/catalog-verification-*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-npm-package
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  network-history:
    if: github.ref_type == 'tag' || inputs.verification_scope != 'kernel-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Install pinned tools and disposable SSH support
        run: |
          npm install --global pnpm@11.20.0 --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/dsh-network" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Validate the byte-preserving network injector
        run: pnpm exec vitest run tests/shaped-tcp.test.ts
      - name: Measure real SSH history and recovery under fixed network conditions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/network-history"
          node scripts/fetch-history-baseline.mjs "$RUNNER_TEMP/network-history/baseline.ts"
          for condition in '0 1000' '80 20' '200 2'; do
            read -r rtt mbit <<< "$condition"
            for store in baseline candidate; do
              module="$RUNNER_TEMP/network-history/baseline.ts"
              if [ "$store" = candidate ]; then module="$PWD/src/remote/history-store.ts"; fi
              node --experimental-transform-types scripts/network-history-benchmark.mjs "$RUNNER_TEMP/dsh-network/node_modules/.bin/dsh" "$module" "$rtt" "$mbit" "$RUNNER_TEMP/network-history/$store-$rtt.json" 100 30
            done
          done
      - name: Check measurements and the normal-network backend recovery target
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { join } from 'node:path'
          for(const rtt of [0,80,200])for(const store of ['baseline','candidate']){
            const report=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'network-history',`${store}-${rtt}.json`),'utf8'))
            assert(report.samplesSufficient)
            assert.deepEqual(report.failures,[])
            assert.equal(report.unchanged.historyRecords.total,0)
            assert.equal(report.unchanged.applicationBytesWritten.total,0)
            assert.equal(report.unchangedOldDataFilesRewritten,0)
            assert(report.remotePidPreserved)
            if(store==='candidate'){
              assert.equal(report.appendOldDataFilesRewritten,0)
              if(rtt<=80)assert(report.recovery.milliseconds.p95<=5000,'Backend recovery exceeded the frozen five-second target; native UI acceptance remains separate')
            }
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ssh-network-history-measurements
          path: ${{ runner.temp }}/network-history/*.json
          if-no-files-found: ignore
          retention-days: 14

  kernel-loss-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Install disposable Linux network and SSH test support
        run: |
          npm install --global pnpm@11.20.0 --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server iproute2 ethtool iptables
          sudo mkdir -p /run/sshd
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/dsh-loss" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Measure real TCP packet loss without modifying user routes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-history"
          node scripts/fetch-history-baseline.mjs "$RUNNER_TEMP/kernel-history/baseline.ts"
          for store in baseline candidate; do
            module="$RUNNER_TEMP/kernel-history/baseline.ts"
            if [ "$store" = candidate ]; then module="$PWD/src/remote/history-store.ts"; fi
            node scripts/kernel-loss-history-benchmark.mjs "$RUNNER_TEMP/dsh-loss/node_modules/.bin/dsh" "$module" "$RUNNER_TEMP/kernel-history/$store-200-loss1.json" 100 30
          done
      - name: Check loss, incremental IO and preservation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { join } from 'node:path'
          for(const store of ['baseline','candidate']){
            const report=JSON.parse(await readFile(join(process.env.RUNNER_TEMP,'kernel-history',`${store}-200-loss1.json`),'utf8'))
            assert(report.samplesSufficient)
            assert.deepEqual(report.failures,[])
            assert.equal(report.conditions.packetLossPercent,1)
            assert.equal(report.unchanged.historyRecords.total,0)
            assert.equal(report.unchanged.applicationBytesWritten.total,0)
            assert.equal(report.unchangedOldDataFilesRewritten,0)
            assert(report.remotePidPreserved)
            if(store==='candidate')assert.equal(report.appendOldDataFilesRewritten,0)
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: kernel-loss-history-measurements
          path: ${{ runner.temp }}/kernel-history/*.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [verify, network-history, kernel-loss-history]
    if: github.repository == 'Biogod2020/dsh-ssh' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-npm-package
          path: release
      - name: Publish the tested archive with npm OIDC
        working-directory: release
        run: |
          shopt -s nullglob
          archives=(*.tgz)
          checksums=(*.tgz.sha256)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          sha256sum --check "${checksums[0]}"
          npm publish "${archives[0]}" --access public --tag latest --ignore-scripts

  verify-installation:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-npm-package
          path: release
      - name: Verify npm and mirror serve the exact tested archive
        run: |
          shopt -s nullglob
          archives=(release/*.tgz)
          test "${#archives[@]}" -eq 1
          node scripts/verify-published.mjs "${archives[0]}"
      - name: Install DSH runtimes for installation acceptance
        run: |
          npm install --global pnpm@11.20.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/dsh-alpha" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-alpha.4
          npm install --prefix "$RUNNER_TEMP/dsh-rc" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          npm install --prefix "$RUNNER_TEMP/dsh-rc21" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Accept installation by package name from npm and mainland mirror
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          DSH_SMOKE_REGISTRY=https://registry.npmjs.org node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-alpha/node_modules/.bin/dsh" "@biogod/dsh-ssh@$version"
          DSH_SMOKE_REGISTRY=https://registry.npmmirror.com node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-rc/node_modules/.bin/dsh" "@biogod/dsh-ssh@$version"
          DSH_SMOKE_REGISTRY=https://registry.npmmirror.com node scripts/compatibility-smoke.mjs "$RUNNER_TEMP/dsh-rc21/node_modules/.bin/dsh" "@biogod/dsh-ssh@$version"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: npm-registry-verification
          path: release/*.registries.json
          if-no-files-found: ignore
